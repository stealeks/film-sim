<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050505" />
<meta name="description" content="FilmSim is an installable offline film camera with simulated film stocks." />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/filmsim.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icons/filmsim-192.png" />
<title>FilmSim</title>
<style>
  :root {
    --panel: rgba(9, 9, 10, 0.72);
    --line: rgba(255,255,255,0.20);
    --text: rgba(255,255,255,0.94);
    --muted: rgba(255,255,255,0.68);
    --danger: #ff4d4d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050505; color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { touch-action: manipulation; }
  #stage { position: fixed; inset: 0; background: #050505; }
  video, canvas#resultCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #050505;
  }
  video { transform: translateZ(0); }
  canvas#resultCanvas { display: none; }
  .hidden { display: none !important; }
  #topBar {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    right: max(14px, env(safe-area-inset-right));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    pointer-events: none;
    z-index: 10;
  }
  .chip, select, button {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    border-radius: 999px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 10px 28px rgba(0,0,0,0.28);
  }
  .chip {
    padding: 9px 12px;
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    user-select: none;
  }
  select {
    max-width: 52vw;
    padding: 10px 36px 10px 14px;
    font-size: 13px;
    appearance: none;
    pointer-events: auto;
    outline: none;
  }
  #controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(24px, env(safe-area-inset-bottom));
    z-index: 12;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 0 18px;
  }
  #shutter {
    width: 86px;
    height: 86px;
    border-radius: 50%;
    padding: 0;
    border: 4px solid rgba(255,255,255,0.95);
    background:
      radial-gradient(circle at center, rgba(255,255,255,0.95) 0 47%, transparent 49% 100%),
      rgba(255,255,255,0.16);
    cursor: pointer;
  }
  #shutter:active { transform: scale(0.96); }
  .pillButton {
    min-width: 92px;
    min-height: 50px;
    padding: 0 18px;
    font-weight: 650;
    font-size: 15px;
    cursor: pointer;
  }
  .pillButton:active { transform: scale(0.98); }
  #saveLink {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    min-width: 112px;
    min-height: 50px;
    padding: 0 20px;
    font-weight: 750;
    border: 1px solid rgba(255,255,255,0.30);
    color: #080808;
    background: rgba(255,255,255,0.92);
    border-radius: 999px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 10px 28px rgba(0,0,0,0.35);
  }
  #status {
    position: fixed;
    left: 50%;
    bottom: calc(max(24px, env(safe-area-inset-bottom)) + 106px);
    transform: translateX(-50%);
    z-index: 14;
    max-width: min(560px, calc(100vw - 32px));
    padding: 12px 16px;
    border-radius: 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 14px;
    text-align: center;
    line-height: 1.35;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  #status small { display: block; margin-top: 7px; color: var(--muted); }
  #flash {
    position: fixed;
    inset: 0;
    z-index: 11;
    background: white;
    opacity: 0;
    pointer-events: none;
  }
  #flash.fire { animation: flash .22s ease-out; }
  @keyframes flash { 0% { opacity: 0; } 18% { opacity: .94; } 100% { opacity: 0; } }
  #busy {
    position: fixed;
    inset: 0;
    z-index: 13;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.18);
    color: white;
    font-weight: 750;
    letter-spacing: .06em;
    text-transform: uppercase;
    font-size: 13px;
  }
  #busy.show { display: flex; }
  @media (max-width: 560px) {
    #shutter { width: 78px; height: 78px; }
    #topBar { align-items: flex-start; }
    .chip { font-size: 11px; max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  }
</style>
</head>
<body>
  <main id="stage" aria-label="Offline film camera">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="resultCanvas"></canvas>
  </main>

  <div id="topBar">
    <select id="stock" aria-label="Film simulation">
      <option value="classic" selected>CLASSIC Neg.</option>
      <option value="chrome">CLASSIC CHROME</option>
      <option value="vivid">Velvia / VIVID</option>
      <option value="mono">ACROS</option>
      <option value="portra">PRO Neg. Std</option>
      <option value="cinestill">ETERNA Cinema</option>
      <option value="gold">NOSTALGIC Neg.</option>
      <option value="delta">ACROS + R Filter</option>
      <option value="instant">REALA ACE</option>
    </select>
  </div>

  <div id="status" class="hidden"></div>
  <div id="busy">Developing</div>
  <div id="flash"></div>

  <div id="controls">
    <button id="retake" class="pillButton hidden" type="button">Retake</button>
    <button id="shutter" type="button" aria-label="Take picture"></button>
    <a id="saveLink" class="hidden" download="film-photo.jpg" href="#">Save</a>
    <button id="share" class="pillButton hidden" type="button">Share</button>
  </div>

  function showStatus(message, detail = '') {
    statusBox.innerHTML = detail ? `${escapeHtml(message)}<small>${escapeHtml(detail)}</small>` : escapeHtml(message);
    statusBox.classList.remove('hidden');
  }

  function hideStatus() {
    statusBox.classList.add('hidden');
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  }

  async function startCamera() {
    hideStatus();
    inResultMode = false;
    resultCanvas.style.display = 'none';
    video.style.display = 'block';
    shutter.classList.remove('hidden');
    retake.classList.add('hidden');
    saveLink.classList.add('hidden');
    shareButton.classList.add('hidden');
    stockSelect.disabled = false;

    if (stream) return;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showStatus(
        'Camera access is not available in this browser context.',
        'The app is fully offline, but camera permission usually needs HTTPS, localhost, or a browser that allows camera from local files.'
      );
      return;
    }

    const constraints = {
      audio: false,
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    };

    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      await video.play();
      cameraReady = true;
    } catch (error) {
      cameraReady = false;
      showStatus(
        'Could not start the camera.',
        error && error.message ? error.message : 'Check camera permission. If opened as a local file and blocked, serve this file from localhost while offline.'
      );
    }
  }

  function flashScreen() {
    flash.classList.remove('fire');
    void flash.offsetWidth;
    flash.classList.add('fire');
  }

  function captureSize() {
    const vw = video.videoWidth || 1280;
    const vh = video.videoHeight || 720;
    const maxSide = Math.min(2200, Math.max(1200, Math.floor((navigator.deviceMemory || 4) >= 4 ? 2200 : 1600)));
    const scale = Math.min(1, maxSide / Math.max(vw, vh));
    return { w: Math.max(1, Math.round(vw * scale)), h: Math.max(1, Math.round(vh * scale)) };
  }

  async function takePicture() {
    if (!cameraReady || !video.videoWidth) {
      showStatus('Camera is not ready yet.');
      return;
    }
    if (inResultMode) return;
    inResultMode = true;
    hideStatus();
    busy.classList.add('show');
    shutter.classList.add('hidden');
    stockSelect.disabled = true;
    flashScreen();

    await nextFrame();
    await nextFrame();

    const { w, h } = captureSize();
    captureCanvas.width = w;
    captureCanvas.height = h;
    resultCanvas.width = w;
    resultCanvas.height = h;
    captureCtx.drawImage(video, 0, 0, w, h);

    // Let the UI update before the heavier pixel pass.
    await delay(35);

    const preset = stocks[stockSelect.value] || stocks.classic;
    const input = captureCtx.getImageData(0, 0, w, h);
    const output = processAsFilm(input, w, h, preset, Date.now() & 0xfffffff);
    resultCtx.putImageData(output, 0, 0);

    busy.classList.remove('show');
    video.style.display = 'none';
    resultCanvas.style.display = 'block';
    retake.classList.remove('hidden');

    await prepareSaveLink(preset.label);
  }

  function nextFrame() {
    return new Promise(resolve => requestAnimationFrame(resolve));
  }

  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function prepareSaveLink(stockName) {
    if (lastObjectUrl) URL.revokeObjectURL(lastObjectUrl);
    lastObjectUrl = null;
    lastBlob = await new Promise(resolve => resultCanvas.toBlob(resolve, 'image/jpeg', 0.94));
    if (!lastBlob) {
      showStatus('The picture was processed, but this browser could not create a save file.');
      return;
    }
    lastObjectUrl = URL.createObjectURL(lastBlob);
    const stamp = new Date().toISOString().replace(/[:.]/g, '-');
    saveLink.href = lastObjectUrl;
    saveLink.download = `film-photo-${stockName.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${stamp}.jpg`;
    saveLink.classList.remove('hidden');

    if (navigator.canShare && navigator.canShare({ files: [new File([lastBlob], saveLink.download, { type: 'image/jpeg' })] })) {
      shareButton.classList.remove('hidden');
    }
  }

  async function sharePhoto() {
    if (!lastBlob) return;
    const file = new File([lastBlob], saveLink.download || 'film-photo.jpg', { type: 'image/jpeg' });
    try {
      await navigator.share({ files: [file], title: 'Film photo' });
    } catch (_) {
      // User cancelled or platform rejected share. The Save button remains available.
    }
  }

  const SRGB_TO_LINEAR_LUT = (() => {
    const lut = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
      const v = i / 255;
      lut[i] = v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    }
    return lut;
  })();

  const LINEAR_TO_SRGB_SIZE = 8192;
  const LINEAR_TO_SRGB_LUT = (() => {
    const lut = new Uint8ClampedArray(LINEAR_TO_SRGB_SIZE + 1);
    for (let i = 0; i <= LINEAR_TO_SRGB_SIZE; i++) {
      const v = i / LINEAR_TO_SRGB_SIZE;
      const s = v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
      lut[i] = Math.round(s * 255);
    }
    return lut;
  })();

  function srgbToLinear(v) {
    return SRGB_TO_LINEAR_LUT[v];
  }

  function linearToSrgb(v) {
    if (v <= 0) return 0;
    if (v >= 1) return 255;
    return LINEAR_TO_SRGB_LUT[Math.round(v * LINEAR_TO_SRGB_SIZE)];
  }

  function clamp01(v) {
    return v < 0 ? 0 : v > 1 ? 1 : v;
  }

  function clamp(min, max, value) {
    return value < min ? min : value > max ? max : value;
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function smoothstep(edge0, edge1, x) {
    const t = clamp01((x - edge0) / (edge1 - edge0));
    return t * t * (3 - 2 * t);
  }

  function smootherstep(t) {
    t = clamp01(t);
    return t * t * t * (t * (t * 6 - 15) + 10);
  }

  function luma(r, g, b) {
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }

  function hashNoise(x, y, seed) {
    let n = (x * 374761393 + y * 668265263 + seed * 1442695041) | 0;
    n = (n ^ (n >>> 13)) | 0;
    n = Math.imul(n, 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
  }

  function valueNoise(x, y, scale, seed) {
    const fx = x / scale;
    const fy = y / scale;
    const x0 = Math.floor(fx);
    const y0 = Math.floor(fy);
    const tx = smootherstep(fx - x0);
    const ty = smootherstep(fy - y0);
    const a = hashNoise(x0, y0, seed);
    const b = hashNoise(x0 + 1, y0, seed);
    const c = hashNoise(x0, y0 + 1, seed);
    const d = hashNoise(x0 + 1, y0 + 1, seed);
    return lerp(lerp(a, b, tx), lerp(c, d, tx), ty);
  }

  function hableResponse(x) {
    const A = 0.22, B = 0.30, C = 0.10, D = 0.20, E = 0.01, F = 0.30;
    return ((x * (A * x + C * B) + D * E) / (x * (A * x + B) + D * F)) - E / F;
  }

  function filmicCurve(x, stock, channelBias) {
    const tone = stock.tone;
    x = Math.max(0, x * tone.speed * channelBias);
    x = Math.pow(x, tone.toe);
    const white = hableResponse(tone.whitePoint);
    let y = white > 0 ? hableResponse(x) / white : hableResponse(x);
    y = tone.pivot + (y - tone.pivot) * tone.contrast;
    const shadow = 1 - smoothstep(0.045, 0.38, y);
    const highlight = smoothstep(0.56, 0.98, y);
    y += tone.shadow * shadow + tone.highlight * highlight;
    y = clamp01(y);
    return tone.gamma === 1 ? y : Math.pow(y, tone.gamma);
  }

  function percentileFromHistogram(hist, count, percentile) {
    if (count <= 0) return 0;
    const target = Math.max(0, Math.min(count - 1, Math.floor(count * percentile)));
    let acc = 0;
    for (let i = 0; i < hist.length; i++) {
      acc += hist[i];
      if (acc > target) return i / 255;
    }
    return 1;
  }

  function analyzeScene(data, w, h) {
    const hist = new Uint32Array(256);
    let sum = 0, sumSq = 0, warm = 0, tint = 0, chroma = 0, count = 0;
    const step = Math.max(3, Math.floor(Math.sqrt((w * h) / 70000)));

    for (let y = 0; y < h; y += step) {
      for (let x = 0; x < w; x += step) {
        const i = (y * w + x) * 4;
        const r = srgbToLinear(data[i]);
        const g = srgbToLinear(data[i + 1]);
        const b = srgbToLinear(data[i + 2]);
        const Y = clamp01(luma(r, g, b));
        const maxc = Math.max(r, g, b);
        const minc = Math.min(r, g, b);
        hist[Math.min(255, (Y * 255) | 0)]++;
        sum += Y;
        sumSq += Y * Y;
        warm += r - b;
        tint += g - (r + b) * 0.5;
        chroma += maxc > 0 ? (maxc - minc) / maxc : 0;
        count++;
      }
    }

    const avg = sum / Math.max(1, count);
    const variance = Math.max(0, sumSq / Math.max(1, count) - avg * avg);
    return {
      avg,
      contrast: Math.sqrt(variance),
      warmth: warm / Math.max(1, count),
      tint: tint / Math.max(1, count),
      chroma: chroma / Math.max(1, count),
      p02: percentileFromHistogram(hist, count, 0.02),
      p18: percentileFromHistogram(hist, count, 0.18),
      p50: percentileFromHistogram(hist, count, 0.50),
      p90: percentileFromHistogram(hist, count, 0.90),
      p98: percentileFromHistogram(hist, count, 0.98)
    };
  }

  function buildHalationMap(data, w, h, stock) {
    const scale = Math.max(3, Math.min(6, Math.round(Math.max(w, h) / 430)));
    const sw = Math.max(1, Math.ceil(w / scale));
    const sh = Math.max(1, Math.ceil(h / scale));
    let a = new Float32Array(sw * sh);
    let b = new Float32Array(sw * sh);

    for (let sy = 0; sy < sh; sy++) {
      const y0 = Math.min(h - 1, sy * scale);
      for (let sx = 0; sx < sw; sx++) {
        const x0 = Math.min(w - 1, sx * scale);
        const i = (y0 * w + x0) * 4;
        const r = srgbToLinear(data[i]);
        const g = srgbToLinear(data[i + 1]);
        const bl = srgbToLinear(data[i + 2]);
        const Y = luma(r, g, bl);
        const redLeak = smoothstep(-0.02, 0.22, r - Math.max(g, bl));
        const blueCut = 1 - 0.25 * smoothstep(0.08, 0.36, bl - Math.max(r, g));
        const source = smoothstep(stock.halationThreshold, 1.0, Y) * (0.78 + 0.22 * redLeak) * blueCut;
        a[sy * sw + sx] = Math.pow(source, 1.35);
      }
    }

    const passes = Math.max(3, Math.min(11, Math.round(stock.halationRadius)));
    for (let pass = 0; pass < passes; pass++) {
      for (let y = 0; y < sh; y++) {
        const row = y * sw;
        for (let x = 0; x < sw; x++) {
          let total = 0, weight = 0;
          for (let k = -2; k <= 2; k++) {
            const xx = Math.min(sw - 1, Math.max(0, x + k));
            const wt = k === 0 ? 6 : (Math.abs(k) === 1 ? 4 : 1);
            total += a[row + xx] * wt;
            weight += wt;
          }
          b[row + x] = total / weight;
        }
      }
      for (let y = 0; y < sh; y++) {
        const row = y * sw;
        for (let x = 0; x < sw; x++) {
          let total = 0, weight = 0;
          for (let k = -2; k <= 2; k++) {
            const yy = Math.min(sh - 1, Math.max(0, y + k));
            const wt = k === 0 ? 6 : (Math.abs(k) === 1 ? 4 : 1);
            total += b[yy * sw + x] * wt;
            weight += wt;
          }
          a[row + x] = total / weight;
        }
      }
    }
    return { map: a, sw, sh, scale };
  }

  function halationAt(hal, x, y) {
    const sx = Math.min(hal.sw - 1, Math.max(0, Math.floor(x / hal.scale)));
    const sy = Math.min(hal.sh - 1, Math.max(0, Math.floor(y / hal.scale)));
    return hal.map[sy * hal.sw + sx];
  }

  function channelMask(value, otherA, otherB, loose, tight) {
    return smoothstep(loose, tight, value - Math.max(otherA, otherB) * 0.86);
  }

  function warmSkinMask(r, g, b, Y) {
    const warm = smoothstep(0.006, 0.090, r - b);
    const rg = 1 - smoothstep(0.10, 0.32, Math.abs(r - g));
    const notBrightRed = 1 - smoothstep(0.20, 0.54, r - Math.max(g, b));
    const lit = smoothstep(0.08, 0.62, Y) * (1 - smoothstep(0.88, 1.0, Y));
    return warm * rg * notBrightRed * lit;
  }

  function compressSaturatedColor(r, g, b, amount) {
    const Y = luma(r, g, b);
    const maxc = Math.max(r, g, b);
    const minc = Math.min(r, g, b);
    const sat = maxc > 0 ? (maxc - minc) / maxc : 0;
    const comp = amount * smoothstep(0.42, 0.95, sat) * smoothstep(0.08, 0.72, maxc - minc);
    const density = 1 - comp * 0.10;
    return [
      (Y + (r - Y) * (1 - comp)) * density,
      (Y + (g - Y) * (1 - comp)) * density,
      (Y + (b - Y) * (1 - comp)) * density
    ];
  }

  function processAsFilm(imageData, w, h, stock, seed) {
    const src = imageData.data;
    const out = new ImageData(w, h);
    const dst = out.data;
    const scene = analyzeScene(src, w, h);
    const hal = buildHalationMap(src, w, h, stock);

    const midExposure = stock.midTarget / Math.max(0.035, scene.p50);
    const highlightExposure = stock.highlightTarget / Math.max(0.28, scene.p98);
    const averageExposure = 0.40 / Math.max(0.10, scene.avg + 0.045);
    const autoExposure = clamp(0.74, 1.36, midExposure * 0.45 + highlightExposure * 0.40 + averageExposure * 0.15);
    const contrastComp = clamp(0.90, 1.10, 1.040 - scene.contrast * 0.22);
    const exposure = stock.exposureBias * autoExposure * contrastComp;
    const warmthComp = clamp(-0.050, 0.050, -scene.warmth * 0.18 * stock.awb);
    const tintComp = clamp(-0.030, 0.030, -scene.tint * 0.16 * stock.awb);

    const cx = (w - 1) * 0.5;
    const cy = (h - 1) * 0.5;
    const maxDist = Math.sqrt(cx * cx + cy * cy) || 1;
    const m = stock.matrix;
    const rgb = stock.rgbBalance;
    const filter = stock.filter || [0.30, 0.59, 0.11];

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;

        let r = srgbToLinear(src[i]);
        let g = srgbToLinear(src[i + 1]);
        let b = srgbToLinear(src[i + 2]);

        r *= exposure * rgb[0] * (1 + warmthComp - tintComp * 0.45);
        g *= exposure * rgb[1] * (1 + tintComp);
        b *= exposure * rgb[2] * (1 - warmthComp - tintComp * 0.55);

        const mr = Math.max(0, r * m[0] + g * m[1] + b * m[2]);
        const mg = Math.max(0, r * m[3] + g * m[4] + b * m[5]);
        const mb = Math.max(0, r * m[6] + g * m[7] + b * m[8]);
        r = mr; g = mg; b = mb;

        let Y = luma(r, g, b);
        const preShadow = 1 - smoothstep(0.035, 0.34, Y);
        const preHighlight = smoothstep(0.56, 1.10, Y);
        const preDeepHighlight = smoothstep(0.78, 1.22, Y);
        const preMid = smoothstep(0.06, 0.40, Y) * (1 - smoothstep(0.55, 1.08, Y));

        r += stock.shadowTint[0] * preShadow + stock.highlightTint[0] * preHighlight;
        g += stock.shadowTint[1] * preShadow + stock.highlightTint[1] * preHighlight;
        b += stock.shadowTint[2] * preShadow + stock.highlightTint[2] * preHighlight;

        const halo = halationAt(hal, x, y);
        r += halo * stock.halation * (1.30 + preDeepHighlight * 0.35);
        g += halo * stock.halation * 0.48;
        b += halo * stock.halation * 0.16;

        r = filmicCurve(r, stock, 1.014);
        g = filmicCurve(g, stock, 1.000);
        b = filmicCurve(b, stock, 0.986);

        Y = luma(r, g, b);
        const shadow = 1 - smoothstep(0.045, 0.32, Y);
        const highlight = smoothstep(0.58, 0.98, Y);
        const mid = smoothstep(0.07, 0.44, Y) * (1 - smoothstep(0.58, 1.0, Y));

        if (stock.mono) {
          const grey = clamp01(filter[0] * r + filter[1] * g + filter[2] * b);
          r = g = b = grey;
        } else {
          const maxc = Math.max(r, g, b);
          const minc = Math.min(r, g, b);
          const chroma = maxc - minc;
          const redM = channelMask(r, g, b, 0.012, 0.210);
          const greenM = channelMask(g, r, b, 0.010, 0.190);
          const blueM = channelMask(b, r, g, 0.010, 0.200);
          const yellowM = smoothstep(0.018, 0.260, Math.min(r, g) - b * 0.88);
          const skin = warmSkinMask(r, g, b, Y);

          r += redM * stock.redShift[0] + yellowM * stock.yellowShift[0] + greenM * stock.greenShift[0] + blueM * stock.blueShift[0];
          g += redM * stock.redShift[1] + yellowM * stock.yellowShift[1] + greenM * stock.greenShift[1] + blueM * stock.blueShift[1];
          b += redM * stock.redShift[2] + yellowM * stock.yellowShift[2] + greenM * stock.greenShift[2] + blueM * stock.blueShift[2];

          const chromeMask = smoothstep(0.10, 0.42, chroma) * (redM * 0.45 + yellowM * 0.45 + greenM * 0.22 + blueM * 0.12);
          const blueChromeMask = smoothstep(0.08, 0.36, chroma) * blueM;
          const chromeDensity = stock.colorChrome * chromeMask + stock.blueChrome * blueChromeMask;
          r *= 1 - chromeDensity * 0.10;
          g *= 1 - chromeDensity * 0.09;
          b *= 1 - chromeDensity * 0.12;

          const compressed = compressSaturatedColor(r, g, b, stock.highSatCompression * (0.65 + 0.35 * highlight));
          r = compressed[0]; g = compressed[1]; b = compressed[2];

          Y = luma(r, g, b);
          let sat = stock.saturation * (0.88 + (stock.midSaturation - 1) * 0.55 * mid - stock.highlightDesat * 0.55 * highlight - stock.shadowDesat * 0.50 * shadow);
          sat *= 1 - skin * stock.skinProtect * 0.24;
          r = Y + (r - Y) * sat;
          g = Y + (g - Y) * sat;
          b = Y + (b - Y) * sat;
        }

        r = r * (1 - stock.blackLift) + stock.blackLift;
        g = g * (1 - stock.blackLift) + stock.blackLift;
        b = b * (1 - stock.blackLift) + stock.blackLift;

        const dx = (x - cx) / maxDist;
        const dy = (y - cy) / maxDist;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const vignette = 1 - stock.vignette * Math.pow(dist, 1.82);
        r *= vignette;
        g *= vignette;
        b *= vignette;

        Y = luma(r, g, b);
        const grainMask = 0.34 + 0.70 * (1 - clamp01(Y)) + 0.24 * highlight;
        const grainStrength = stock.grain * grainMask * Math.pow(stock.iso / 400, 0.18);
        const clump = (valueNoise(x, y, stock.grainSize, seed + 17) - 0.5) * 1.35;
        const fine = (hashNoise(x, y, seed + 113) - 0.5) * 0.55;
        const grain = (clump + fine) * grainStrength;
        if (stock.mono) {
          r += grain * 1.65;
          g += grain * 1.65;
          b += grain * 1.65;
        } else {
          const chromaA = (valueNoise(x + 47, y - 19, stock.grainSize * 1.65, seed + 211) - 0.5) * stock.chromaGrain;
          const chromaB = (valueNoise(x - 73, y + 31, stock.grainSize * 1.45, seed + 307) - 0.5) * stock.chromaGrain;
          r += grain + chromaA * 0.85;
          g += grain * 0.90 - chromaA * 0.38 + chromaB * 0.22;
          b += grain * 0.76 + chromaB * 0.82;
        }

        const bloom = stock.bloom * halo * (0.35 + 0.65 * preDeepHighlight);
        r += bloom;
        g += bloom * 0.86;
        b += bloom * 0.68;

        dst[i] = linearToSrgb(r);
        dst[i + 1] = linearToSrgb(g);
        dst[i + 2] = linearToSrgb(b);
        dst[i + 3] = src[i + 3];
      }
    }
    return out;
  }

  shutter.addEventListener('click', takePicture);
  retake.addEventListener('click', () => {
    inResultMode = false;
    resultCanvas.style.display = 'none';
    video.style.display = 'block';
    retake.classList.add('hidden');
    saveLink.classList.add('hidden');
    shareButton.classList.add('hidden');
    shutter.classList.remove('hidden');
    stockSelect.disabled = false;
    hideStatus();
  });
  shareButton.addEventListener('click', sharePhoto);

  window.addEventListener('pagehide', () => {
    if (lastObjectUrl) URL.revokeObjectURL(lastObjectUrl);
    if (stream) stream.getTracks().forEach(track => track.stop());
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && stream && video.paused && !inResultMode) video.play().catch(() => {});
  });

  startCamera();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
})();
</script>
